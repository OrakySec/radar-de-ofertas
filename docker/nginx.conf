# Radar de Ofertas — nginx do site estático.
# Substitui o /etc/nginx/conf.d/default.conf da imagem (ver Dockerfile).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O TLS termina no Traefik: sem isso o nginx montaria redirects com
    # URL absoluta em http://. Assim o redirect é só o caminho.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /casa/ -> /casa (anúncio colado com barra no final não pode dar 404).
    # Mantém a query string (gclid, fbclid, utm_*).
    location ~ ^/(?<slug>[^/]+)/$ {
        return 301 /$slug$is_args$args;
    }

    # config.js é gerado no start do container a partir das variáveis de
    # ambiente (links dos grupos, IDs de tracking). Nunca pode ficar em
    # cache: senão trocar um link no Portainer demora dias pra valer.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # HTML sempre revalidado (CSS/JS usam ?v= pra versionar).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1d;
    }

    # URLs limpas: /casa serve casa.html, /games serve games.html...
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
